[workspace]
members = [
    "crates/core",
    "crates/cli",
]
resolver = "2"

[workspace.dependencies]
rusqlite   = { version = "0.31", features = ["bundled"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
clap_complete = "4"
walkdir    = "2"
regex      = "1"
blake3     = "1"
fastembed  = "7.1.1"

[profile.release]
strip = true
